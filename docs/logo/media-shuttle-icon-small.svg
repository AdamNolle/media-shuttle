<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="iconTitle">
  <title id="iconTitle">Media Shuttle app icon</title>
  <!-- Generated by docs/logo/build.py from media-shuttle-bus.svg. Edit the mark, not this file. -->

  <defs>
    <!-- The container is lit from the same direction as the bus inside it. -->
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EC5C4D"/>
      <stop offset="0.45" stop-color="#D2372F"/>
      <stop offset="1" stop-color="#88201A"/>
    </linearGradient>
    <!-- A warm pool behind the bus so the yellow has something to sit in. -->
    <radialGradient id="tileGlow" cx="0.5" cy="0.57" r="0.5">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#FFD9A0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>

    <linearGradient id="sPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDF3E"/>
      <stop offset="1" stop-color="#F2B400"/>
    </linearGradient>
    <linearGradient id="sChassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262D"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="sGlass" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1D2433"/>
      <stop offset="1" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="sRim" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#F6F8FA"/>
      <stop offset="1" stop-color="#9BA2AC"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#tileGlow)"/>
    <rect width="1024" height="420" fill="url(#tileSheen)"/>
    <rect y="700" width="1024" height="324" fill="url(#tileFloor)"/>
    <g transform="translate(16 28) scale(0.968750)">
<path d="M112 256 H782 L912 386 V670 H112 Z"
        fill="url(#sChassis)" stroke="url(#sChassis)" stroke-width="40"
        stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="138" y="282" width="512" height="362" rx="54" fill="url(#sPaint)"/>

  <g fill="url(#sGlass)">
    <rect x="172" y="316" width="130" height="128" rx="14"/>
    <rect x="329" y="316" width="130" height="128" rx="14"/>
    <rect x="486" y="316" width="130" height="128" rx="14"/>
  </g>

  <!-- Driver's window, identical to the detailed mark: it is the cue that makes the
       shape a bus rather than a box, so it survives every size. -->
  <path d="M694 316 H784 L840 372 V444 H694 Z" fill="url(#sGlass)"
        stroke="url(#sGlass)" stroke-width="22" stroke-linejoin="round"/>

  <!-- One rail, on the centreline of the two it replaces. -->
  <rect x="172" y="514" width="444" height="20" rx="10" fill="#0D0E12"/>

  <g>
    <circle cx="280" cy="676" r="84" fill="#0E1015"/>
    <circle cx="280" cy="676" r="42" fill="url(#sRim)"/>
    <circle cx="778" cy="676" r="84" fill="#0E1015"/>
    <circle cx="778" cy="676" r="42" fill="url(#sRim)"/>
  </g>
    </g>
  </g>

  <!-- Container edge: a lit top lip, the way a physical tile catches light. -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="226.5" fill="none"
        stroke="#FFFFFF" stroke-width="3" opacity="0.10"/>
  <path d="M228 3 H796 A225 225 0 0 1 1021 228" fill="none" stroke="#FFFFFF"
        stroke-width="3" opacity="0.15" stroke-linecap="round"/>
</svg>
