name: Personal runner preflight

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-preflight:
    name: Personal ${{ matrix.os }} runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            labels: [self-hosted, Windows, X64, personal-ci]
    steps:
      - name: Verify Windows build environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('git','bash','pwsh','gh')) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Output "$tool available at $($command.Source)"
          }
          git --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
