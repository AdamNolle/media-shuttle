name: Release native macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Run safety tests
        run: swift test --scratch-path "$RUNNER_TEMP/media-shuttle-tests"

      - name: Build universal macOS app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./scripts/package-macos.sh "$VERSION"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=(
            "artifacts/MediaShuttle-v$VERSION-macOS-universal.dmg"
            "artifacts/SHA256SUMS.txt"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Media Shuttle $VERSION"
          fi
