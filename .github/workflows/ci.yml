name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PSExecutionPolicyPreference: RemoteSigned

jobs:
  choose-windows-runner:
    runs-on: [self-hosted, Windows, X64, personal-ci]
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      self_hosted: ${{ steps.select.outputs.self_hosted }}
    steps:
      - name: Select a safe Windows runner
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:HEAD_REPOSITORY -ne $env:GITHUB_REPOSITORY) {
            'runs_on=["windows-latest"]' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'self_hosted=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Fork pull request: using an isolated GitHub-hosted runner.'
          } else {
            'runs_on=["self-hosted","Windows","X64","personal-ci"]' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'self_hosted=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Using the Adlon Windows runner.'
          }

  windows:
    name: Windows build and core tests
    needs: choose-windows-runner
    runs-on: ${{ fromJSON(needs.choose-windows-runner.outputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - name: Prepare Adlon build tools
        if: needs.choose-windows-runner.outputs.self_hosted == 'true'
        shell: powershell
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\cmd', 'C:\Program Files\PowerShell\7', 'C:\Program Files\GitHub CLI', 'C:\Program Files\7-Zip', 'C:\msys64\ucrt64\bin')
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) { $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"; $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" }
          }
          $paths | Where-Object { Test-Path $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'AGENT_TOOLSDIRECTORY=C:\personal-ci\toolcache' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'DOTNET_INSTALL_DIR=C:\personal-ci\toolcache\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tools = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) '_tool'
          "CARGO_HOME=$tools\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$tools\rustup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tools\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and run core tests
        shell: pwsh
        run: .\windows\build.ps1 -Clean -SkipInstaller

  macos:
    name: macOS core tests
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["macos-15"]') || fromJSON('["self-hosted","macOS","media-shuttle-macos"]') }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run safety suite
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/media-shuttle-tests"
