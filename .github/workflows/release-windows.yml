name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  choose-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
    steps:
      - name: Prefer the server runner when it is online
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/actions/runners" | jq -e \
            '.runners[] | select(.status == "online" and ([.labels[].name] | index("media-shuttle-release") != null))' >/dev/null; then
            echo 'runs_on=["self-hosted","Windows","X64","media-shuttle-release"]' >> "$GITHUB_OUTPUT"
            echo "Using the Adlon Windows runner."
          else
            echo 'runs_on=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "Adlon Windows runner is offline; using GitHub-hosted Windows."
          fi

  release:
    needs: choose-runner
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\windows\src\MediaShuttle\MediaShuttle.csproj -Raw
          $expected = "v$($project.Project.PropertyGroup.Version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expected."
          }

      - name: Build installer and portable package
        shell: pwsh
        run: .\windows\build.ps1 -Clean

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $assets = @(
            ".\windows\artifacts\MediaShuttle-Setup-v$version-win-x64.exe",
            ".\windows\artifacts\MediaShuttle-v$version-win-x64.zip",
            ".\windows\artifacts\SHA256SUMS-windows.txt"
          )

          $gh = Join-Path $env:ProgramFiles "GitHub CLI\gh.exe"
          & $gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & $gh release upload $tag @assets --clobber
          }
          else {
            & $gh release create $tag @assets --verify-tag --generate-notes --title "Media Shuttle $version"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
