name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PSExecutionPolicyPreference: RemoteSigned

jobs:
  release:
    runs-on: [self-hosted, Windows, X64, personal-ci]
    steps:
      - name: Set up personal Windows build tools
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\cmd', 'C:\Program Files\PowerShell\7', 'C:\Program Files\GitHub CLI', 'C:\Program Files\7-Zip')
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) { $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"; $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" }
          }
          $paths | Where-Object { Test-Path $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\windows\src\MediaShuttle\MediaShuttle.csproj -Raw
          $expected = "v$($project.Project.PropertyGroup.Version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expected."
          }

      - name: Build installer and portable package
        shell: pwsh
        run: .\windows\build.ps1 -Clean

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $assets = @(
            ".\windows\artifacts\MediaShuttle-Setup-v$version-win-x64.exe",
            ".\windows\artifacts\MediaShuttle-v$version-win-x64.zip",
            ".\windows\artifacts\SHA256SUMS-windows.txt"
          )

          $gh = Join-Path $env:ProgramFiles "GitHub CLI\gh.exe"
          & $gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & $gh release upload $tag @assets --clobber
          }
          else {
            & $gh release create $tag @assets --verify-tag --generate-notes --title "Media Shuttle $version"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
