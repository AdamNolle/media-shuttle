<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 524" width="840" height="524">
  <!-- The Media Shuttle mark for Icon Composer: the SD card drawn as a shuttle bus.
       Flat fills and no gradients, because the tile behind it supplies the shading and
       Icon Composer applies its own material treatment on top. The geometry matches
       docs/logo/media-shuttle-bus-small.svg with the mark's own margins trimmed off. -->

  <path d="M20 20 H690 L820 150 V434 H20 Z"
        fill="#14161B" stroke="#14161B" stroke-width="40"
        stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="46" y="46" width="512" height="362" rx="54" fill="#FFD016"/>

  <g fill="#12151C">
    <rect x="80" y="80" width="130" height="128" rx="14"/>
    <rect x="237" y="80" width="130" height="128" rx="14"/>
    <rect x="394" y="80" width="130" height="128" rx="14"/>
  </g>

  <!-- Driver's window, cut at the same 45 degrees as the card's corner. -->
  <path d="M602 80 H692 L748 136 V208 H602 Z" fill="#12151C"
        stroke="#12151C" stroke-width="22" stroke-linejoin="round"/>

  <rect x="80" y="278" width="444" height="20" rx="10" fill="#12151C"/>

  <g>
    <circle cx="188" cy="440" r="84" fill="#0E1015"/>
    <circle cx="188" cy="440" r="42" fill="#C9CED6"/>
    <circle cx="686" cy="440" r="84" fill="#0E1015"/>
    <circle cx="686" cy="440" r="42" fill="#C9CED6"/>
  </g>
</svg>
